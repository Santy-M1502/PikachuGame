<nav

    <div class="collapse navbar-collapse" id="menuPikachu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link fw-bold text-dark" routerLink="/juegos">Juegos</a>

          <a class="nav-link fw-bold text-dark" routerLink="/encuesta">Encuesta</a>
        </li>
