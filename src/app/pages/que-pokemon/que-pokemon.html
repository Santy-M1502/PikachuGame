<div class="game-container">

  <!-- Pantalla de inicio -->
  <div *ngIf="pantalla() === 'inicio'" class="inicio">
    <h1>¡Quién es ese Pokémon?</h1>
    <p>Observa la silueta y selecciona la opción correcta. ¡Acumula puntos!</p>
    <button (click)="comenzarJuego()">Iniciar</button>
  </div>

  <!-- Pantalla de juego -->
  <div *ngIf="pantalla() === 'juego'" class="retro-tv-container">

    <div class="tv">
      <div class="tv-screen">
        <div class="pokemon-area">
          <img [src]="pokemonSilueta()" alt="Silueta Pokémon" class="pokemon-image">
        </div>

        <div class="info-area">
          <h2>¿Quién es este Pokémon?</h2>
          <p>Puntos: {{ puntos() }}</p>
          <p>Tiempo total: {{ tiempo() }}s</p>
          <p *ngIf="resultado()">{{ resultado() }}</p>

          <div class="answer-buttons">
            <button *ngFor="let opcion of opciones()" 
                    (click)="seleccionarOpcion(opcion)" 
                    [disabled]="!botonesHabilitados()">
              {{ opcion }}
            </button>
          </div>
        </div>
      </div>

      <div class="tv-buttons">
        <div class="button"></div>
        <div class="button"></div>
        <div class="button"></div>
      </div>
    </div>

  </div>

  <!-- Pantalla de fin -->
  <div *ngIf="pantalla() === 'fin'" class="fin">
    <h1>¡Juego Terminado!</h1>
    <p>Tu puntaje final: {{ puntos() }}</p>
    <button (click)="reiniciarJuego()">Volver a inicio</button>
  </div>

</div>
