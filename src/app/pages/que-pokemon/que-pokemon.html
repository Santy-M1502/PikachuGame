<div class="game-wrapper">

  <!-- INICIO -->
  <div *ngIf="pantalla() === 'inicio'" class="inicio">
    <h1>⚡ Typing Challenge — Pokémon ⚡</h1>
    <button (click)="comenzarJuego()">Comenzar</button>
  </div>

  <!-- JUEGO -->
  <div *ngIf="pantalla() === 'juego'" class="juego">
    <p class="frase">{{ textoObjetivo() }}</p>

    <textarea
    [(ngModel)]="textoTipeado"
    (ngModelChange)="onInput($event)"
    placeholder="Escribí la frase aquí..."
    autofocus
    rows="3">
  </textarea>

    <div class="stats">
      <p>⏱️ Tiempo: {{ tiempo() }}s</p>
      <p>❌ Errores: {{ errores() }}</p>
      <p>🎯 Precisión: {{ precision() }}%</p>
      <p>💨 WPM: {{ wpm() }}</p>
      <p>⭐ Puntos: {{ puntos() }}</p>
    </div>
  </div>

  <!-- FIN -->
  <div *ngIf="pantalla() === 'fin'" class="fin">
    <h2>¡Ronda terminada!</h2>
    <p>🎯 Precisión: {{ precision() }}%</p>
    <p>💨 WPM: {{ wpm() }}</p>
    <p>⭐ Puntos: {{ puntos() }}</p>

    <button (click)="comenzarJuego()">Jugar otra vez</button>
  </div>

</div>
