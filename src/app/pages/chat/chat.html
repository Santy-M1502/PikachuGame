<app-nav-bar></app-nav-bar>
<div class="chat-page-container">
  <div class="chat-window">
    <header class="chat-header">
      <div class="chat-title">Chat</div>
    </header>

    <section class="chat-body" #body>
      @if(getMessages().length === 0){
        <div class="empty">
          Bienvenido — escribe abajo para empezar
        </div>
        }
        @for(msg of chatService.messages(); track $index){
      <div [ngClass]="{ 'mio': msg.user_id === userId, 'otro': msg.user_id !== userId }">
          <div class="meta">
            <span class="name">{{ msg.usuario ? (msg.usuario.nombre + ' ' + msg.usuario.apellido) : 'Anon' }} -</span>
            @if(msg.created_at){ <span class="time"> {{ msg.created_at | date: 'dd/MM/yyyy HH:mm' }} </span> }
          </div>
        <div class="bubble">{{ msg.text }}</div>
      </div>
      }
    </section>

    <footer class="chat-footer">
        <input class="chat-input" 
                type="text" 
                placeholder="Escribe un mensaje..."
                [(ngModel)]="newMessage" 
                (keyup.enter)="send()" />
        <button class="btn-send" (click)="send()">➤</button>
    </footer>
  </div>
</div>
