<app-nav-bar></app-nav-bar>
<div class="experiencia-container">
  <h2>Ranking de Usuarios</h2>

  <!-- Input búsqueda -->
  <div style="margin-bottom:12px;">
    <input
      type="text"
      placeholder="Buscar (mínimo 3 letras para búsqueda en DB)..."
      [value]="searchTerm()"
      (input)="onSearchChange($any($event.target).value)"
    />
  </div>

  <!-- Selección de tipo -->
  <label for="tipo">Selecciona tipo:</label>
  <select
    id="tipo"
    [value]="tipoSeleccionado()"
    (change)="onTipoChange($any($event.target).value)"
  >
    <option value="">-- Selecciona --</option>
    <option *ngFor="let t of tipos" [value]="t.value">{{ t.label }}</option>
  </select>

  <!-- Selección de juego (solo si aplica) -->
  <div *ngIf="tipoSeleccionado() !== 'masPuntosGeneral' && tipoSeleccionado() !== ''" style="margin-top:8px;">
    <label for="juego">Selecciona juego:</label>
    <select
      id="juego"
      [value]="juegoSeleccionado() ?? ''"
      (change)="onJuegoChange( +($any($event.target).value) || null )"
    >
      <option value="">-- Selecciona --</option>
      <option *ngFor="let j of juegos()" [value]="j.id">{{ j.nombre }}</option>
    </select>
  </div>

  <!-- Tabla de resultados -->
  <table *ngIf="puntajes().length > 0" style="margin-top:12px;">
    <thead>
      <tr>
        <th>Usuario</th>
        <th>Puntos</th>
        <th *ngIf="tipoSeleccionado() === 'mejorTiempo' || tipoSeleccionado() === 'topPuntajes'">Tiempo</th>
      </tr>
    </thead>
    <tbody>
      <!-- Si querés filtrar cliente adicionalmente por searchTerm (p.e. cuando term < 3) podés usar la pipe aquí -->
      <tr *ngFor="let p of puntajes() | searchFilter: (searchTerm() || '') : 'usuarios.nombre,usuarios.apellido,nombre,apellido' ; index as i">
        <td>{{ p.usuarios?.nombre ?? p.nombre }} {{ p.usuarios?.apellido ?? p.apellido }}</td>
        <td>{{ p.puntos }}</td>
        <td *ngIf="tipoSeleccionado() === 'mejorTiempo' || tipoSeleccionado() === 'topPuntajes'">
          {{ p.tiempo }}
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Sin resultados -->
  <p *ngIf="puntajes().length === 0 && tipoSeleccionado()">
    No hay resultados para esta selección.
  </p>

  <p *ngIf="loading()">Cargando...</p>
</div>
